server {
    listen 80;
    server_name growcery.ru www.growcery.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name growcery.ru www.growcery.ru;

    ssl_certificate /etc/letsencrypt/live/growcery.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/growcery.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/react-burger;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
